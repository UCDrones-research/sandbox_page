meta:
  name: "UC Drones"

# Replace the path below with your actual wordmark file.
logo:
  images:
    wordmark: images/COE_logo.png
  small: wordmark
  medium: wordmark
  large: wordmark

color:
  palette:
    blue: "#1295D8"             # AA18 only (large/bold text) — not used as link/body color below
    blue-dark: "#005581"        # full AA on white at any text size
    blue-extra-dark: "#002033"
    gold: "#FFB511"             # accent only — no light text on this color
    teal: "#00778B"             # full AA with white text
    orange: "#FF6E1B"           # requires dark text, not white
    gray-extra-dark: "#171717"
    gray-warm-1: "#DBD5CD"

  primary: blue-dark
  secondary: gold
  background: "#FFFFFF"
  foreground: gray-extra-dark
  link: blue-dark

typography:
  fonts:
    - family: Arial
      source: system
    - family: Georgia
      source: system
 
  base:
    family: Arial
  headings:
    family: Arial
    weight: 600
  link:
    color: blue-dark